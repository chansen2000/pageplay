[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pageplay"
version = "0.9.0"
requires-python = ">=3.10"
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pageplay = "pageplay.cli:main"
pageplay-gui = "pageplay.gui:main"
